name: 每日源可用性体检

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 探活点播源、直播订阅与 M3U 快照
        run: python3 scripts/check.py tvbox.json tvbox-legacy.json
